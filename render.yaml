services:
  - type: web
    name: employee-salary-management-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RAILS_ENV
        value: production
    disk:
      name: sqlite-storage
      mountPath: /rails/storage
      sizeGB: 1

  - type: web
    name: employee-salary-management-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
